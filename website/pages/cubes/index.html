<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" href="/vite.svg"/>
    <link rel="stylesheet" type="text/css" href="/src/styles/index.css"/>
    <script type="module" src="./scripts.ts"></script>
    <title>Grundlage - Scene</title>
</head>
<body>
<nav-bar></nav-bar>

<main>
    <h1>CSS-3D scene</h1>
    <p class="scene-hint">
        Click the scene to capture the mouse, then look with the mouse and move with
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>,
        <kbd>Space</kbd> up / <kbd>Shift</kbd> down. <kbd>Esc</kbd> releases the mouse.
    </p>

    <!-- Hardcoded Phase 1 scene. Several cubes share an identical rotation but
         sit at different positions: the case where naive per-face culling
         showed the wrong faces under perspective. With backface-visibility the
         compositor culls correctly regardless of position. A couple of varied
         cubes round out the eyeball test for perspective and camera motion. -->
    <scene-world>
        <scene-cube position="0 0 0" rotation="0 25 0"></scene-cube>
        <scene-cube position="3 0 0" rotation="0 25 0"></scene-cube>
        <scene-cube position="-3 0 0" rotation="0 25 0"></scene-cube>
        <scene-cube position="0 0 -3" rotation="0 25 0"></scene-cube>
        <scene-cube position="3 0 -3" rotation="0 25 0"></scene-cube>
        <scene-cube position="-3 0 -3" rotation="0 25 0"></scene-cube>

        <scene-cube position="0 2 -3" rotation="20 45 0" size="1.5"></scene-cube>
        <scene-cube position="-3 1 0" size="1 2 1"></scene-cube>
        <scene-cube position="3 0 3" width="2" rotation="0 -30 10"></scene-cube>
    </scene-world>
</main>
</body>
</html>
